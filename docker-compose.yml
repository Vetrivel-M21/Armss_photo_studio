name: armss-photo-studio

services:
  # ----------------------------------------------------
  # ARMSS Photo Studio Nginx Gateway & Reverse Proxy
  # Only this service exposes a host port (default: 8070).
  # All internal services stay isolated in the private network.
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: armss_studio_nginx
    restart: always
    ports:
      - "${GATEWAY_PORT:-8070}:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - armss_studio_network

  # ----------------------------------------------------
  # MySQL Database Service (MySQL 8.4)
  # Internal only -- no host port binding.
  # ----------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: armss_studio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-StudioDB@2026}
      MYSQL_DATABASE: armss_poster_studio
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - armss_studio_mysql_data:/var/lib/mysql
    networks:
      - armss_studio_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ----------------------------------------------------
  # ARMSS Photo Studio Backend Service (Go API -- port 8080)
  # Uses native persistent local storage volume (/app/data/storage)
  # Served over HTTP via /files/ through the nginx gateway.
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: armss_studio_backend
    restart: always
    environment:
      - PORT=8080
      - ENV=production
      # MySQL DSN -- 'mysql' resolves to mysql container via Docker DNS
      - MYSQL_DSN=root:${MYSQL_PASSWORD:-StudioDB@2026}@tcp(mysql:3306)/armss_poster_studio?parseTime=true&loc=UTC&multiStatements=true
      # Object storage: "local" (persistent volume, zero MinIO dependency)
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - LOCAL_STORAGE_DIR=/app/data/storage
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8070}
      # Session & Admin Seed
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-long-random-string-2026}
      - SESSION_TTL_HOURS=168
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@armss.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@123}
      # AI Agent provider
      - AGENT_PROVIDER=${AGENT_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      # Image generation
      - DEFAULT_IMAGE_PROVIDER=${DEFAULT_IMAGE_PROVIDER:-flux}
      - FLUX_API_KEY=${FLUX_API_KEY:-}
      - FLUX_BASE_URL=${FLUX_BASE_URL:-https://api.together.xyz}
      - FLUX_MODEL=${FLUX_MODEL:-black-forest-labs/FLUX.1-schnell}
      - FLUX_IMAGE_COST_CENTS=${FLUX_IMAGE_COST_CENTS:-3}
      - IDEOGRAM_API_KEY=${IDEOGRAM_API_KEY:-}
      - IDEOGRAM_BASE_URL=${IDEOGRAM_BASE_URL:-https://api.ideogram.ai}
      - IDEOGRAM_MODEL=${IDEOGRAM_MODEL:-V_2}
      - IDEOGRAM_IMAGE_COST_CENTS=${IDEOGRAM_IMAGE_COST_CENTS:-8}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_IMAGE_COST_CENTS=${OPENAI_IMAGE_COST_CENTS:-8}
      # Brand
      - BRAND_NAVY=${BRAND_NAVY:-#16265A}
      - BRAND_RED=${BRAND_RED:-#D32027}
      - BRAND_SAFFRON=${BRAND_SAFFRON:-#F5A623}
      - BRAND_CREAM=${BRAND_CREAM:-#FFF8EE}
      - BRAND_CONTACT_STRING=${BRAND_CONTACT_STRING:-ARMSS Employment Solutions | +91 00000 00000}
      - BRAND_FONT_PATH=assets/fonts/Go-Regular.ttf
    volumes:
      - armss_studio_storage_data:/app/data/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - armss_studio_network

  # ----------------------------------------------------
  # ARMSS Photo Studio Frontend Service (React + Vite static)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
    container_name: armss_studio_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - armss_studio_network

volumes:
  armss_studio_mysql_data:
    name: armss_studio_mysql_data
  armss_studio_storage_data:
    name: armss_studio_storage_data

networks:
  armss_studio_network:
    driver: bridge
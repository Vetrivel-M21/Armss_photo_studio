# ----------------------------------------------------
# ARMSS Photo Studio — Nginx SPA Config (inside frontend container)
# Serves the built React app; proxying is handled by the outer gateway nginx
# ----------------------------------------------------
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # All routes fall back to index.html for client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed static assets (JS/CSS bundles)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
